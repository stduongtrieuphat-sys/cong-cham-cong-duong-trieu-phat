<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cổng chấm công - Dương Triệu Phát</title><style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}header{background:#173b72;color:#fff;padding:22px 28px}h1{margin:0;font-size:24px}.wrap{max-width:1050px;margin:30px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 5px 22px #0001}.login{max-width:420px;margin:60px auto}input,select,button{width:100%;padding:13px;margin-top:8px;border-radius:9px;border:1px solid #d6dce7;box-sizing:border-box}button{border:0;font-weight:bold;cursor:pointer}.blue{background:#1769e0;color:#fff}.gray{background:#edf2f8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.clock{text-align:center;font-size:42px;font-weight:bold;color:#173b72;margin:20px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#f7f9fc}.hidden{display:none}@media(max-width:650px){.actions{grid-template-columns:1fr}}</style></head><body>
<header><h1>CỔNG CHẤM CÔNG</h1><div>CÔNG TY DƯƠNG TRIỆU PHÁT</div></header><main class="wrap">
<section id="login" class="card login"><h2>Đăng nhập</h2><select id="name"><option>Lê Hiền</option><option>Linh</option><option>Admin</option></select><input id="password" type="password" placeholder="Mật khẩu"><button class="blue" onclick="login()">ĐĂNG NHẬP</button></section>
<section id="emp" class="hidden"><div class="card"><h2 id="hello"></h2><div class="clock" id="clock"></div><div id="status"></div><div class="actions"><button class="blue" onclick="act('/api/checkin')">CHẤM CÔNG VÀO</button><button class="gray" onclick="act('/api/checkout')">CHẤM CÔNG RA</button></div></div><div class="card"><h2>Lịch sử của tôi</h2><div id="mine"></div></div></section>
<section id="adm" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>Dữ liệu chấm công</h2><button class="blue" style="width:auto" onclick="download()">XUẤT EXCEL</button></div><div id="all"></div></div></section>
</main><script>
let token='';const $=id=>document.getElementById(id);function tick(){$('clock').textContent=new Date().toLocaleTimeString('vi-VN')}setInterval(tick,1000);tick();
async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,password:$('password').value})}),j=await r.json();if(!r.ok)return alert(j.error);token=j.token;$('login').classList.add('hidden');if(j.role==='admin'){ $('adm').classList.remove('hidden');loadAll()}else{$('emp').classList.remove('hidden');$('hello').textContent='Xin chào, '+j.name;loadMine()}}
async function act(url){let r=await fetch(url,{method:'POST',headers:{Authorization:token}}),j=await r.json();alert(j.error||'Đã ghi nhận thành công');loadMine()}
async function loadMine(){let r=await fetch('/api/my-records',{headers:{Authorization:token}}),a=await r.json();$('mine').innerHTML='<table><tr><th>Ngày</th><th>Giờ vào</th><th>Giờ ra</th><th>Trạng thái</th></tr>'+a.map(x=>`<tr><td>${x.date}</td><td>${x.in||''}</td><td>${x.out||''}</td><td>${x.out?'Hoàn tất':'Chưa chấm ra'}</td></tr>`).join('')+'</table>'}
async function loadAll(){let r=await fetch('/api/records',{headers:{Authorization:token}}),a=await r.json();$('all').innerHTML='<table><tr><th>Nhân viên</th><th>Ngày</th><th>Giờ vào</th><th>Giờ ra</th><th>Trạng thái</th></tr>'+a.map(x=>`<tr><td>${x.user}</td><td>${x.date}</td><td>${x.in}</td><td>${x.out}</td><td>${x.out?'Hoàn tất':'Chưa chấm ra'}</td></tr>`).join('')+'</table>'}
function download(){fetch('/api/export',{headers:{Authorization:token}}).then(r=>r.blob()).then(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Cham_cong_Duong_Trieu_Phat.xlsx';a.click()})}
</script></body></html>
